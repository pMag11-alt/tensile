[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensile"
version = "0.1.0"
description = "A small deep-learning framework built from scratch on NumPy: autograd, layers, optimisers, and a GPT."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "pMag11-alt" }]
dependencies = ["numpy>=1.24"]
keywords = ["autograd", "deep-learning", "neural-networks", "numpy", "transformer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.17.2"]
plots = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/pMag11-alt/tensile"

[tool.setuptools.packages.find]
include = ["tensile*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B023", "B905"]
